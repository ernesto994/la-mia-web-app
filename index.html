
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>La mia web app</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px #00000010;
    }

    .symbol { font-size: 48px; }

    h1 { margin-bottom: 12px; }

    p {
      color: #6b7280;
      line-height: 1.6;
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      color: #166534;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="symbol">🚀</div>
    <h1>La mia web app</h1>
    <p>Benvenuto! Questa è la prima pagina
       della tua applicazione.</p>

    <button onclick="saluta()">
      Prova la mia app
    </button>

    <div id="message" aria-live="polite"></div>
  </main>

  <script>
    function saluta() {
      document.getElementById("message").textContent =
        "Funziona! Hai creato la tua prima interazione.";
    }
  </script>
</body>
</html>
