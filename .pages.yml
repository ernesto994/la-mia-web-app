media:
  input: foto
  output: foto

content:
  - name: settings
    label: Aspetto e testi del sito
    path: settings.json
    type: file
    fields:
      - { name: brand, label: Nome del negozio, type: string }
      - { name: sottotitolo, label: "Sottotitolo (scheda browser)", type: string }
      - { name: heroEyebrow, label: "Etichetta sopra il titolo (es. Fatto a mano...)", type: string }
      - { name: heroTitolo, label: Titolo grande della pagina iniziale, type: string }
      - { name: heroTesto, label: Testo di presentazione, type: string }
      - { name: heroFoto, label: Foto grande iniziale, type: image }
      - { name: whatsapp, label: "Numero WhatsApp (con prefisso, es. 393312345678)", type: string }
      - { name: catalogoTitolo, label: Titolo sezione catalogo, type: string }
      - { name: catalogoSottotitolo, label: Sottotitolo sezione catalogo, type: string }
      - { name: passo1Titolo, label: "Passo 1 - titolo", type: string }
      - { name: passo1Testo, label: "Passo 1 - testo", type: string }
      - { name: passo2Titolo, label: "Passo 2 - titolo", type: string }
      - { name: passo2Testo, label: "Passo 2 - testo", type: string }
      - { name: passo3Titolo, label: "Passo 3 - titolo", type: string }
      - { name: passo3Testo, label: "Passo 3 - testo", type: string }
      - { name: footerTagline, label: "Footer - frase sotto il nome", type: string }
      - { name: footerOrdini, label: "Footer - come ordinare (testo)", type: string }
      - { name: footerCol3Titolo, label: "Footer - titolo terza colonna", type: string }
      - { name: footerCol3Testo, label: "Footer - testo terza colonna", type: string }
      - name: tema
        label: Tema colori del sito
        type: select
        options:
          values:
            - { value: natale, label: "Natale (rosso mattone e oro)" }
            - { value: primavera, label: "Primavera (fucsia)" }
            - { value: custom, label: Personalizzato }
      - { name: colorePrimario, label: "Personalizzato - colore principale (es. #7c2d1e)", type: string }
      - { name: coloreAccento, label: "Personalizzato - colore di accento (es. #b8860b)", type: string }
      - { name: coloreSfondo, label: "Personalizzato - colore sfondo (es. #faf6ee)", type: string }

  - name: articoli
    label: Articoli (catalogo)
    path: prodotti.json
    type: file
    fields:
      - name: prodotti
        label: Articoli
        type: object
        list: true
        fields:
          - { name: nome, label: Nome articolo, type: string, required: true }
          - { name: prezzo, label: "Prezzo base (€)", type: number }
          - { name: categoria, label: "Categoria (es. Accessori, Casa, Natale...)", type: string }
          - { name: sottocategoria, label: Sottocategoria, type: string }
          - { name: descrizione, label: Descrizione, type: string }
          - { name: foto, label: Foto articolo, type: image }
          - { name: visibile, label: Visibile sul sito, type: boolean, default: true }
          - name: taglie
            label: "Taglie tra cui scegliere (lascia vuoto se non servono)"
            type: object
            list: true
            fields:
              - { name: nome, label: "Nome taglia (es. S, M, L)", type: string }
              - { name: extra, label: "Supplemento (€)", type: number, default: 0 }
          - name: tessuti
            label: "Tessuti tra cui scegliere (es. cotone, velluto)"
            type: object
            list: true
            fields:
              - { name: nome, label: Nome tessuto, type: string }
              - { name: foto, label: Foto del tessuto, type: image }
              - { name: extra, label: "Supplemento (€)", type: number, default: 0 }
          - name: colori
            label: Colore della stoffa
            type: object
            list: true
            fields:
              - { name: nome, label: Nome colore, type: string, required: true }
              - { name: foto, label: Foto del tessuto reale, type: image }
              - { name: codice, label: "Oppure codice colore (es. #8b0000)", type: string }
              - { name: fotoProdotto, label: "Foto dell'articolo in questo colore (cambia l'anteprima)", type: image }
              - { name: extra, label: "Supplemento (€)", type: number, default: 0 }
          - name: coloriAccessorio
            label: Colore dell'accessorio
            type: object
            list: true
            fields:
              - { name: nome, label: Nome colore, type: string, required: true }
              - { name: codice, label: "Codice colore (es. #b8860b)", type: string }
              - { name: fotoProdotto, label: "Foto dell'articolo con questo accessorio (cambia l'anteprima)", type: image }
              - { name: extra, label: "Supplemento (€)", type: number, default: 0 }
          - { name: scritta, label: "Il cliente può aggiungere una scritta (nome/frase)", type: boolean, default: false }
          - { name: maxCaratteri, label: Numero max caratteri della scritta, type: number, default: 20 }
          - { name: costoScritta, label: "Costo personalizzazione scritta (€)", type: number, default: 0 }
          - { name: scrittaExtra, label: "Permetti una seconda scritta (personalizzazione aggiuntiva)", type: boolean, default: false }
          - { name: costoAggiuntivo, label: "Costo personalizzazione aggiuntiva (€)", type: number, default: 0 }
          - { name: scrittaX, label: "Posizione scritta: da sinistra (0-100, 50 = centro)", type: number, default: 50 }
          - { name: scrittaY, label: "Posizione scritta: dall'alto (0-100, 50 = centro)", type: number, default: 80 }
          - { name: scrittaDim, label: "Dimensione scritta (consigliato 24)", type: number, default: 24 }
          - { name: scrittaRot, label: "Inclinazione scritta in gradi (0 = dritta)", type: number, default: 0 }
          - name: font
            label: Stili di scrittura offerti (se la scritta è attiva)
            type: object
            list: true
            fields:
              - { name: nome, label: Nome stile, type: string }
              - name: stile
                label: Tipo carattere
                type: select
                options:
                  values:
                    - { value: corsivo, label: Corsivo elegante }
                    - { value: classico, label: "Classico (serif)" }
                    - { value: moderno, label: "Moderno (sans)" }
                    - { value: stampatello, label: "Stampatello (monospace)" }
              - { name: extra, label: "Supplemento (€)", type: number, default: 0 }
          - name: coloriScritta
            label: Colori tra cui scegliere PER LA SCRITTA
            type: object
            list: true
            fields:
              - { name: nome, label: Nome colore, type: string }
              - { name: codice, label: "Codice colore (es. #222222)", type: string }
              - { name: extra, label: "Supplemento (€)", type: number, default: 0 }
